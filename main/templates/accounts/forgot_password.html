{% extends "base.html" %}

{% block content %}
<div class="container narrow">
  <div class="page-head">
    <h1>Forgot password</h1>
    <p>We'll send a reset link to your campus email.</p>
  </div>

  <div class="paper">
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        {% include "components/form_field.html" with field=field %}
      {% endfor %}
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Send reset link</button>
        <a class="btn" href="{% url 'accounts:login' %}">Back to sign in</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
