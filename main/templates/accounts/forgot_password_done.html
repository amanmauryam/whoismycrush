{% extends "base.html" %}

{% block content %}
<div class="container narrow">
  <div class="page-head">
    <h1>Check your email</h1>
    <p>If that email has a campus profile, a reset link is on its way.</p>
  </div>

  <div class="paper">
    <p class="muted">
      The link expires in a couple of hours. If nothing arrives, check the spam folder
      or try again.
    </p>
    <a class="btn btn-primary btn-block" href="{% url 'accounts:forgot_password' %}">Send it again</a>
  </div>
</div>
{% endblock %}
