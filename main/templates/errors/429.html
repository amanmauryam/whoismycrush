{% extends "base.html" %}

{% block title %}Too many attempts{% endblock %}

{% block content %}
<div class="container narrow">
  <div class="error-page">
    <span class="doodle" aria-hidden="true">⏳</span>
    <p class="error-code">429</p>
    <h1>Too many attempts</h1>
    <p class="muted">You're going a little too fast. Take a breather and try again in a moment.</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{% url 'campus:landing' %}">Back to the board</a>
      <a class="btn" href="javascript:history.back()">Go back</a>
    </div>
  </div>
</div>
{% endblock %}
